    <!--
      SSG manifest resilience shim.
      Background: vite-react-ssg constructs `/static-loader-data-manifest-${HASH}.json`
      from window.__VITE_REACT_SSG_HASH__, which is baked into the HTML at build time.
      During CDN edge transitions between deploys, a user can load stale HTML pointing
      at a hash whose manifest file no longer exists on the active deployment, producing
      a 404 plaintext "The page could not be found." that crashes `.json()` parsing.
      This interceptor catches that specific failure and transparently re-fetches the
      pointer file (`/manifestInfo.json`, always current) to retry with the live hash.
      Must run before the main bundle so the patched `fetch` is in effect when the
      bundle reads it.
    -->
    <script>
      // 1) Fetch shim: when the bundle asks for /static-loader-data-manifest-X.json
      //    and that hash is gone (deploy rotated it), recover by reading the
      //    always-current pointer (/manifestInfo.json) and retrying with the live hash.
      (function () {
        if (typeof window === 'undefined' || !window.fetch) return;
        var originalFetch = window.fetch.bind(window);
        var manifestRegex = /\/static-loader-data-manifest-[A-Za-z0-9_-]+\.json(\?|$)/;
        function safeEmpty() {
          return new Response('{}', {
            status: 200,
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
          });
        }
        function retryViaPointer(init) {
          return originalFetch('/manifestInfo.json?ts=' + Date.now(), { cache: 'no-store' })
            .then(function (pointerResp) {
              if (!pointerResp || !pointerResp.ok) return safeEmpty();
              return pointerResp.json()
                .then(function (pointer) {
                  if (!pointer || !pointer.path) return safeEmpty();
                  return originalFetch(pointer.path, init).then(function (r) {
                    return r && r.ok ? r : safeEmpty();
                  });
                })
                .catch(function () { return safeEmpty(); });
            })
            .catch(function () { return safeEmpty(); });
        }
        window.fetch = function (input, init) {
          var url = '';
          if (typeof input === 'string') url = input;
          else if (input && typeof input.url === 'string') url = input.url;
          else if (input && typeof input.href === 'string') url = input.href; // URL object
          if (!manifestRegex.test(url)) return originalFetch(input, init);
          return originalFetch(input, init)
            .then(function (resp) {
              if (resp && resp.ok) return resp;
              return retryViaPointer(init);
            })
            .catch(function () { return retryViaPointer(init); });
        };
      })();

      // 2) Self-healing safety net: if a JSON parse error still escapes
      //    (anything we missed in the shim), do one auto-reload to fetch
      //    a fresh deploy. Tracked in sessionStorage to avoid infinite loops.
      (function () {
        if (typeof window === 'undefined') return;
        var KEY = '__ssg_recovery__';
        function getCount() {
          try { return parseInt(sessionStorage.getItem(KEY) || '0', 10) || 0; } catch (e) { return 0; }
        }
        function setCount(n) {
          try { sessionStorage.setItem(KEY, String(n)); } catch (e) {}
        }
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : reason.toString()))) || '';
          // JSON parse errors across browsers (Chrome / Firefox / Safari)
          var looksJsonParse =
            /Unexpected token/i.test(msg) ||
            /not valid JSON/i.test(msg) ||
            /JSON\.parse/i.test(msg) ||
            /JSON Parse error/i.test(msg) ||
            /Unexpected end of JSON/i.test(msg) ||
            /Unexpected identifier/i.test(msg);
          // Dynamic-import / code-split chunk failures (stale HTML referencing
          // a retired chunk hash after deploy).
          var looksChunkLoad =
            /Failed to fetch dynamically imported module/i.test(msg) ||
            /Importing a module script failed/i.test(msg) ||
            /error loading dynamically imported module/i.test(msg) ||
            /ChunkLoadError/i.test(msg);
          if (!looksJsonParse && !looksChunkLoad) return;
          var n = getCount();
          if (n >= 2) {
            // Give up, let it bubble. Avoid reload loops.
            setCount(0);
            return;
          }
          setCount(n + 1);
          e.preventDefault();
          // Tiny delay so the rejection finishes propagating; then full reload.
          setTimeout(function () { window.location.reload(); }, 50);
        });
        // Clear the counter on a clean load.
        window.addEventListener('load', function () {
          setTimeout(function () {
            try { sessionStorage.removeItem(KEY); } catch (e) {}
          }, 2500);
        });
      })();
    </script>
